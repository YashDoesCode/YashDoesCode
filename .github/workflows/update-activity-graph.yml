name: Update Real-time Activity Graph

on:
  schedule:
    # Runs daily at midnight UTC to sync real-time commits and automatically roll over new years
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_activity_graph.py'

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Activity Graphs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_activity_graph.py --username YashDoesCode --start-year 2021 --output-dir assets

      - name: Commit and push updated activity graphs
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg assets/activity-graph-yearly.svg assets/activity-metadata.json
          if git diff --staged --quiet; then
            echo "No activity changes detected. Skipping commit."
          else
            git commit -m "chore(activity): update real-time activity graphs [skip ci]"
            git push
          fi
