<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="400" viewBox="0 0 1030 400" role="img" aria-label="Yearly Commit Showcase">
  <defs>
    <linearGradient id="barMono" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Monochrome Card Background -->
  <rect x="0.5" y="0.5" width="1029" height="399" rx="16" fill="#08080a" stroke="#18181c" stroke-width="1" />

  <!-- Y-Axis Grid -->
  <line x1="68" y1="330.0" x2="980" y2="330.0" stroke="#1f1f25" stroke-width="1" />
  <text x="56" y="333.5" text-anchor="end" font-size="11" fill="#71717a" font-family="'Inter', sans-serif">0</text>
  <line x1="68" y1="271.2" x2="980" y2="271.2" stroke="#18181c" stroke-width="1" stroke-dasharray="3 3" />
  <text x="56" y="274.8" text-anchor="end" font-size="11" fill="#71717a" font-family="'Inter', sans-serif">250</text>
  <line x1="68" y1="212.5" x2="980" y2="212.5" stroke="#18181c" stroke-width="1" stroke-dasharray="3 3" />
  <text x="56" y="216.0" text-anchor="end" font-size="11" fill="#71717a" font-family="'Inter', sans-serif">500</text>
  <line x1="68" y1="153.8" x2="980" y2="153.8" stroke="#18181c" stroke-width="1" stroke-dasharray="3 3" />
  <text x="56" y="157.2" text-anchor="end" font-size="11" fill="#71717a" font-family="'Inter', sans-serif">750</text>
  <line x1="68" y1="95.0" x2="980" y2="95.0" stroke="#18181c" stroke-width="1" stroke-dasharray="3 3" />
  <text x="56" y="98.5" text-anchor="end" font-size="11" fill="#71717a" font-family="'Inter', sans-serif">1000</text>

  <!-- Header -->
  <text x="68" y="42" font-size="16" font-weight="600" fill="#f4f4f5" font-family="'Inter', sans-serif">Annual Commit Showcase</text>
  <text x="68" y="62" font-size="13" fill="#71717a" font-family="'Inter', sans-serif">Yearly commit distribution (1,391 total contributions across 2021 – 2026)</text>

  <!-- Top Right Controls -->
  <text x="980" y="42" text-anchor="end" font-size="16" font-weight="600" fill="#f4f4f5" font-family="'Inter', sans-serif">1,391 Total Commits</text>

  <!-- Bars Content -->
  
    <!-- Year 2021 -->
    <rect x="106.5" y="137.5" width="75.0" height="192.5" rx="6" fill="url(#barMono)" stroke="#3f3f46" stroke-width="1" />
    <text x="144.0" y="129.5" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5" font-family="'Inter', sans-serif">819</text>
    <text x="144.0" y="352.0" text-anchor="middle" font-size="12" font-weight="500" fill="#a1a1aa" font-family="'Inter', sans-serif">2021</text>
    <text x="144.0" y="368.0" text-anchor="middle" font-size="10" fill="#52525b" font-family="'Inter', sans-serif">commits</text>
        

    <!-- Year 2022 -->
    <rect x="258.5" y="307.7" width="75.0" height="22.3" rx="6" fill="url(#barMono)" stroke="#3f3f46" stroke-width="1" />
    <text x="296.0" y="299.7" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5" font-family="'Inter', sans-serif">95</text>
    <text x="296.0" y="352.0" text-anchor="middle" font-size="12" font-weight="500" fill="#a1a1aa" font-family="'Inter', sans-serif">2022</text>
    <text x="296.0" y="368.0" text-anchor="middle" font-size="10" fill="#52525b" font-family="'Inter', sans-serif">commits</text>
        

    <!-- Year 2023 -->
    <rect x="410.5" y="309.8" width="75.0" height="20.2" rx="6" fill="url(#barMono)" stroke="#3f3f46" stroke-width="1" />
    <text x="448.0" y="301.8" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5" font-family="'Inter', sans-serif">86</text>
    <text x="448.0" y="352.0" text-anchor="middle" font-size="12" font-weight="500" fill="#a1a1aa" font-family="'Inter', sans-serif">2023</text>
    <text x="448.0" y="368.0" text-anchor="middle" font-size="10" fill="#52525b" font-family="'Inter', sans-serif">commits</text>
        

    <!-- Year 2024 -->
    <rect x="562.5" y="326.0" width="75.0" height="4.0" rx="6" fill="url(#barMono)" stroke="#3f3f46" stroke-width="1" />
    <text x="600.0" y="318.0" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5" font-family="'Inter', sans-serif">3</text>
    <text x="600.0" y="352.0" text-anchor="middle" font-size="12" font-weight="500" fill="#a1a1aa" font-family="'Inter', sans-serif">2024</text>
    <text x="600.0" y="368.0" text-anchor="middle" font-size="10" fill="#52525b" font-family="'Inter', sans-serif">commits</text>
        

    <!-- Year 2025 -->
    <rect x="714.5" y="325.8" width="75.0" height="4.2" rx="6" fill="url(#barMono)" stroke="#3f3f46" stroke-width="1" />
    <text x="752.0" y="317.8" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5" font-family="'Inter', sans-serif">18</text>
    <text x="752.0" y="352.0" text-anchor="middle" font-size="12" font-weight="500" fill="#a1a1aa" font-family="'Inter', sans-serif">2025</text>
    <text x="752.0" y="368.0" text-anchor="middle" font-size="10" fill="#52525b" font-family="'Inter', sans-serif">commits</text>
        

    <!-- Year 2026 -->
    <rect x="866.5" y="243.1" width="75.0" height="87.0" rx="6" fill="url(#barMono)" stroke="#3f3f46" stroke-width="1" />
    <text x="904.0" y="235.1" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5" font-family="'Inter', sans-serif">370</text>
    <text x="904.0" y="352.0" text-anchor="middle" font-size="12" font-weight="500" fill="#a1a1aa" font-family="'Inter', sans-serif">2026</text>
    <text x="904.0" y="368.0" text-anchor="middle" font-size="10" fill="#52525b" font-family="'Inter', sans-serif">commits</text>
        
</svg>
